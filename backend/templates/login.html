<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Login · PneumoScan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --indigo:     #4F46E5;
        --indigo-l:   #EEF2FF;
        --violet:     #7C3AED;
        --mid:        #818CF8;
        --bg:         #F8FAFF;
        --bg2:        #F1F5FF;
        --surface:    #FFFFFF;
        --surface2:   #F1F5FF;
        --border:     #E5E7EB;
        --border2:    #C7D2FE;
        --text:       #111827;
        --text2:      #374151;
        --muted:      #6B7280;
        --muted2:     #9CA3AF;
        --success:    #10B981;
        --error:      #EF4444;
        --pill:       9999px;
        --shadow-md:  0 4px 20px rgba(79,70,229,0.09), 0 1px 4px rgba(0,0,0,0.05);
        --shadow-lg:  0 12px 40px rgba(79,70,229,0.13), 0 2px 8px rgba(0,0,0,0.06);
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html { scroll-behavior: smooth; }

      body {
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
      }

      /* ── SUBTLE BG BLOBS ── */
      .blob {
        position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
        filter: blur(60px); opacity: 0.35;
      }
      .blob1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(79,70,229,0.12), transparent); top: -150px; left: -100px; }
      .blob2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(124,58,237,0.10), transparent); bottom: -100px; right: -80px; }

      .page { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; }

      /* ── HEADER ── */
      header {
        padding: 0 32px;
        height: 64px;
        display: flex; align-items: center; gap: 14px;
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(16px);
        position: sticky; top: 0; z-index: 100;
        background: rgba(255,255,255,0.92);
        box-shadow: 0 1px 12px rgba(79,70,229,0.06);
      }
      .logo-wrap { display: flex; align-items: center; gap: 10px; }
      .logo-icon {
        width: 36px; height: 36px;
        background: linear-gradient(135deg, var(--indigo), var(--violet));
        border-radius: 10px;
        display: grid; place-items: center;
        box-shadow: 0 4px 12px rgba(79,70,229,0.3);
      }
      .logo-icon svg { width: 17px; height: 17px; stroke: white; fill: none; stroke-width: 2.2; }
      .logo-text {
        font-family: 'Playfair Display', serif;
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--text);
      }
      .logo-text span { color: var(--indigo); font-style: italic; }

      /* ── AUTH CONTAINER ── */
      .auth-container {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      .auth-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 44px 52px;
        width: 100%;
        max-width: 460px;
        position: relative;
        overflow: hidden;
        box-shadow: var(--shadow-lg);
        animation: fade-up 0.7s ease both;
      }
      .auth-card::before {
        content: '';
        position: absolute; top: 0; left: 0; right: 0; height: 3px;
        background: linear-gradient(90deg, var(--indigo), var(--violet));
      }
      .auth-title {
        font-family: 'Playfair Display', serif;
        font-size: 2rem;
        text-align: center;
        color: var(--text);
        margin-bottom: 8px;
      }
      .auth-subtitle {
        text-align: center;
        font-size: 0.88rem;
        color: var(--muted);
        margin-bottom: 32px;
      }

      /* ── FORM FIELDS ── */
      .field-group { margin-bottom: 24px; position: relative; }
      .section-label {
        font-size: 0.64rem;
        font-family: 'JetBrains Mono', monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 10px;
        display: block;
      }
      .field-input {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 16px;
        font-family: 'Inter', sans-serif;
        font-size: 0.88rem;
        font-weight: 400;
        color: var(--text);
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .field-input::placeholder { color: var(--muted2); }
      .field-input:focus {
        border-color: var(--border2);
        box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
      }

      .btn-submit {
        margin-top: 12px;
        width: 100%;
        display: flex; align-items: center; justify-content: center; gap: 10px;
        background: linear-gradient(135deg, var(--indigo), var(--violet));
        color: white;
        font-family: 'Inter', sans-serif;
        font-size: 0.84rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        padding: 14px 32px;
        border: none; border-radius: 10px;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
        box-shadow: 0 6px 24px rgba(79,70,229,0.35);
      }
      .btn-submit:hover { opacity: 0.92; transform: translateY(-2px); box-shadow: 0 10px 32px rgba(79,70,229,0.45); }
      .btn-submit:active { transform: translateY(0); }

      .auth-switch {
        margin-top: 24px;
        text-align: center;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .auth-switch a {
        color: var(--indigo);
        text-decoration: none;
        font-weight: 600;
      }
      .auth-switch a:hover { text-decoration: underline; }

      .error-message {
        color: var(--error);
        font-size: 0.72rem;
        margin-top: 12px;
        text-align: center;
        display: none;
        background: #FEE2E2;
        border: 1px solid #FECACA;
        border-radius: 8px;
        padding: 8px 12px;
      }

      @keyframes fade-up {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>

  <body>
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="page">
      <header>
        <div class="logo-wrap">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24">
              <path d="M3 12h3l3-9 4 18 3-9h5"/>
            </svg>
          </div>
          <div class="logo-text">Respiratory<span>Ai</span></div>
        </div>
      </header>

      <div class="auth-container">
        <div class="auth-card" id="authSection">
          <h2 class="auth-title" id="authTitle">Welcome Back</h2>
          <p class="auth-subtitle" id="authSubtitle">Log in to safely upload your recordings.</p>

          <form id="authForm" onsubmit="event.preventDefault(); submitAuth();">
            <div class="field-group">
              <label class="section-label" for="email">Email</label>
              <input type="email" class="field-input" id="email" required placeholder="doctor@clinic.com" autocomplete="email" />
            </div>
            
            <div class="field-group">
              <label class="section-label" for="password">Password</label>
              <input type="password" class="field-input" id="password" required placeholder="••••••••" autocomplete="current-password" />
            </div>

            <div class="error-message" id="errorMessage"></div>

            <button type="submit" class="btn-submit" id="submitBtn">
              Log In
            </button>

            <div style="margin: 20px 0; display: flex; align-items: center; text-align: center; color: var(--muted); font-size: 0.8rem;">
              <div style="flex: 1; height: 1px; background: var(--border);"></div>
              <span style="padding: 0 10px;">or</span>
              <div style="flex: 1; height: 1px; background: var(--border);"></div>
            </div>
            
            <button type="button" class="btn-submit" id="googleBtn" onclick="submitGoogleAuth()" style="background: var(--surface); border: 1px solid var(--border); box-shadow: 0 1px 4px rgba(0,0,0,0.08); color: var(--text2);">
              <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: currentColor; margin-left: -4px;">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
              </svg>
              Sign in with Google
            </button>
          </form>

          <div class="auth-switch">
            <span id="switchText">Don't have an account?</span> 
            <a href="#" onclick="toggleMode(event)" id="switchBtn">Sign Up</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Firebase Initialization -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } 
        from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

      // Your web app's Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyAaEJRIVbN7kadduBIw2ULKETr0ShKysXQ",
        authDomain: "lung-login.firebaseapp.com",
        projectId: "lung-login",
        storageBucket: "lung-login.firebasestorage.app",
        messagingSenderId: "357222360735",
        appId: "1:357222360735:web:e222d8c9b6121ae77ea4aa"
      };

      let app, auth;
      try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
      } catch (error) {
        console.error("Firebase config error:", error);
      }

      const provider = new GoogleAuthProvider();

      let isLoginPath = true;

      window.toggleMode = (e) => {
        e.preventDefault();
        isLoginPath = !isLoginPath;
        document.getElementById('authTitle').innerText = isLoginPath ? 'Welcome Back' : 'Create Account';
        document.getElementById('authSubtitle').innerText = isLoginPath ? 'Log in to safely upload your recordings.' : 'Sign up for a new account.';
        document.getElementById('submitBtn').innerText = isLoginPath ? 'Log In' : 'Sign Up';
        document.getElementById('switchText').innerText = isLoginPath ? "Don't have an account?" : "Already have an account?";
        document.getElementById('switchBtn').innerText = isLoginPath ? "Sign Up" : "Log In";
        document.getElementById('errorMessage').style.display = 'none';
      };

      window.submitAuth = () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const errDiv = document.getElementById('errorMessage');
        const btn = document.getElementById('submitBtn');
        
        btn.disabled = true;
        btn.style.opacity = 0.5;

        // Ensure firebase handles
        if(!auth) {
          errDiv.innerText = "Firebase configuration is not set. Please update the configuration in login.html.";
          errDiv.style.display = 'block';
          btn.disabled = false;
          btn.style.opacity = 1;
          return;
        }

        const authPromise = isLoginPath 
          ? signInWithEmailAndPassword(auth, email, pass)
          : createUserWithEmailAndPassword(auth, email, pass);

        authPromise.then((userCredential) => {
          // Success! Redirect to app
          window.location.href = '/';
        }).catch((error) => {
          errDiv.innerText = error.message.replace('Firebase: ', '');
          errDiv.style.display = 'block';
          btn.disabled = false;
          btn.style.opacity = 1;
        });
      };

      window.submitGoogleAuth = () => {
        const errDiv = document.getElementById('errorMessage');
        if(!auth) {
          errDiv.innerText = "Firebase configuration is not set. Please update the configuration in login.html.";
          errDiv.style.display = 'block';
          return;
        }
        signInWithPopup(auth, provider).then((result) => {
          window.location.href = '/';
        }).catch((error) => {
          errDiv.innerText = error.message.replace('Firebase: ', '');
          errDiv.style.display = 'block';
        });
      };

      // Redirect if already logged in
      if(auth) {
        onAuthStateChanged(auth, (user) => {
          if (user) {
            window.location.href = '/';
          }
        });
      }
    </script>
  </body>
</html>
